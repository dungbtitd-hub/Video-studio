name: video_studio
description: Video Studio mobile (Android/iOS) - Flutter UI over the shared C++ core.
publish_to: none
version: 0.9.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  file_picker: ^13.3.0
  path_provider: ^2.1.4
  gal: ^2.3.0
  record: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Fakes for the walkthrough test (test/walkthrough_test.dart).
  file_picker_platform_interface: any
  path_provider_platform_interface: any
  cross_file: any

flutter:
  uses-material-design: true
